<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>BookShare Mobile Super-App</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: #f8fafc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 360px;
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { font-size: 0.9rem; opacity: 0.85; line-height: 1.5; margin: 0 0 18px; }
        a.btn {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 999px;
        }
    </style>
</head>
<body>
    <!-- [BS-MOBILE-APK] Shell fallback khi mất kết nối mạng trong Capacitor WebView -->
    <div class="card">
        <h1>📚 BookShare Mobile</h1>
        <p>Đang kết nối tới cổng dịch vụ Thư viện &amp; Cho thuê sách giấy BookShare...</p>
        <a class="btn" href="https://bookshare.castle-tech.cloud/MobileApp">Mở BookShare Mobile</a>
    </div>
    <script>
        setTimeout(function () {
            window.location.href = 'https://bookshare.castle-tech.cloud/MobileApp';
        }, 600);
    </script>
</body>
</html>
