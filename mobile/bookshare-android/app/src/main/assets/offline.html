<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kết nối gián đoạn - BookShare</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 390px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
        }
        h1 {
            font-size: 1.15rem;
            margin: 0 0 8px;
        }
        p {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.5;
            margin: 0 0 18px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px 16px;
            cursor: pointer;
        }
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }
        .btn-primary:active {
            background: #1d4ed8;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:active {
            background: #e2e8f0;
        }
        .meta {
            margin-top: 16px;
            font-size: 0.76rem;
            color: #64748b;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #f1f5f9; }
            .card { background: #1e293b; border-color: #334155; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35); }
            .icon { background: #1e3a8a; color: #93c5fd; }
            p, .meta { color: #94a3b8; }
            .btn-secondary { background: #0f172a; color: #e2e8f0; border-color: #334155; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">B</div>
        <h1 id="offlineTitle">Không thể kết nối máy chủ BookShare</h1>
        <p id="offlineDesc">Vui lòng kiểm tra kết nối Wi-Fi / 4G hoặc thử tải lại trang sau vài giây.</p>
        <div class="actions">
            <button type="button" class="btn-primary" onclick="retryLast()">Thử kết nối lại</button>
            <button type="button" class="btn-secondary" onclick="goHome()">Về Trang chủ BookShare</button>
        </div>
        <div class="meta">BookShare Mobile v5.6 • bookshare.castle-tech.cloud</div>
    </main>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var reason = params.get('reason') || '';
            var titleEl = document.getElementById('offlineTitle');
            var descEl = document.getElementById('offlineDesc');
            if (reason === 'timeout') {
                titleEl.textContent = 'Kết nối phản hồi quá chậm';
                descEl.textContent = 'Máy chủ BookShare phản hồi lâu hơn dự kiến do mạng yếu. Hãy kiểm tra Wi-Fi / 4G rồi bấm Thử kết nối lại.';
            } else if (reason === 'ssl') {
                titleEl.textContent = 'Kết nối bảo mật HTTPS bị gián đoạn';
                descEl.textContent = 'Thiết bị không thể xác minh chứng chỉ bảo mật (hãy kiểm tra ngày giờ hệ thống hoặc mạng Wi-Fi công cộng) rồi thử lại.';
            }
        })();

        function retryLast() {
            if (window.BookShareAndroidBridge && typeof window.BookShareAndroidBridge.retryLastPage === 'function') {
                window.BookShareAndroidBridge.retryLastPage();
            } else {
                goHome();
            }
        }

        function goHome() {
            if (window.BookShareAndroidBridge && typeof window.BookShareAndroidBridge.reloadHome === 'function') {
                window.BookShareAndroidBridge.reloadHome();
            } else if (history.length > 1) {
                history.back();
            } else {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
