<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kết nối gián đoạn - BookShare</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 380px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
        }
        h1 {
            font-size: 1.15rem;
            margin: 0 0 8px;
        }
        p {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.5;
            margin: 0 0 20px;
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px 16px;
            cursor: pointer;
        }
        button:active {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">B</div>
        <h1>Không thể kết nối máy chủ BookShare</h1>
        <p>Vui lòng kiểm tra kết nối Wi-Fi / 4G hoặc đảm bảo máy chủ BookShare đang hoạt động rồi thử tải lại.</p>
        <button type="button" onclick="retryConnect()">Thử kết nối lại</button>
    </main>
    <script>
        function retryConnect() {
            if (window.BookShareAndroidBridge && typeof window.BookShareAndroidBridge.reloadHome === 'function') {
                window.BookShareAndroidBridge.reloadHome();
            } else if (history.length > 1) {
                history.back();
            } else {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
